name: Alertas diários de obrigações

# Este workflow foi convertido para execução manual apenas (workflow_dispatch)
# e deixado em backlog. Agendamento automático foi removido para evitar
# falhas diárias quando os secrets não estiverem configurados.

on:
  workflow_dispatch: {}

jobs:
  enviar-alertas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install

      - name: Check required secrets (skip if missing)
        id: check_secrets
        run: |
          set -euo pipefail
          missing=false
          for v in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY RESEND_API_KEY ALERT_FROM_EMAIL; do
            if [ -z "${!v:-}" ]; then
              echo "::warning::Secret $v is missing"
              missing=true
            fi
          done
          if [ "$missing" = true ]; then
            echo "Required secrets are missing; skipping alert step (manual/backlog)."
            exit 0
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}

      - name: Send alerts
        run: node scripts/enviar-alertas.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
